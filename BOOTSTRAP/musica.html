<!doctype html>
<html lang="en">

<head>
    <title></title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap CSS v5.2.1 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

</head>

<body>
    <header>
        <!-- place navbar here -->
    </header>
    <mai>
        <div class="container mt-5">
            <table class="table table-stiped" id="musica">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Portada</th>
                        <th scope="col">Nombre</th>
                        <th scope="col">Duración</th>
                        <th scope="col">Genero</th>
                        <th scope="col">Artista</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody>



                </tbody>
            </table>
        </div>


        </main>
        <footer>
            <!-- place footer here -->
        </footer>

        <script>
            $(document).ready(function () {
                $.ajax({
                    method: 'get',
                    url: 'https://6985235c6964f10bf2527597.mockapi.io/musica'
                })
                    .done(function (msg) {
                        console.log(msg);
                        msg.forEach(function (cancion, index) {
                            $('#musica tbody').append(
                                '<tr>' +
                                '<th scope="row">' + cancion.id + '</th>' +
                                '<td><img src="' + cancion.portada + '" width="50px"/></td>' +
                                '<td>' + cancion.nombre + '</td>' +
                                '<td>' + cancion.duracion + '</td>' +
                                '<td>' + cancion.genero + '</td>' +
                                '<td>' + cancion.artista + '</td>' +
                                '<td><button class="btn btn-danger btn-sm" onclick="eliminarCancion(' + cancion.id + ')">Eliminar</button></td>' +
                                '</tr>'
                            );
                        });
                    })


            });


            function eliminarCancion(id) {
                $.ajax({
                    method: 'delete',
                    url: 'https://6985235c6964f10bf2527597.mockapi.io/musica/' + id
                })
                 .done(function (msg) {
                    console.log(msg);
                    alert("Cancion eliminada");
                    location.reload();
                 })
            }
        </script>

        <!-- Bootstrap JavaScript Libraries -->
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"></script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"></script>
</body>

</html>
