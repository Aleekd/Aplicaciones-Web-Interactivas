<!doctype html>
<html lang="en">
    <head>
        <title>jquery</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />

        <!-- cdn jquery-->
         <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

    </head>

    <body>
        <div>
            <span class="btn btn-primary" id="boton1"> Esto no es un boton</span>
            <span class="btn btn-danger" id="boton2"> Esto no es un boton</span>
            <input type="text" id="entrada1" value="texto de ejemplo" disabled="true"></div>
        </div>

        <div id="contenedor">
            
        </div>

        <script>
        $(document).ready(function() {

            $.ajax({
                method: "GET",
                url: "some.php",
                
            })
            //alert("Hola Mundo con Jquery");
            $("#boton1").click(function() {
                $("#entrada1").Attr("disabled", false);
            });

            $("#entrada1").on("change", function() {
                alert($(this).val());
            });

             $("#boton2").on("click", function() {
                $("#boton1").removeClass('button-primary').addClass('btn btn-success');
            });

            $('#contenedor').prepend('<h2>Hola Mundo con Jquery</h2>');
            $('#contenedor').append('<input></input>');
            $('#contenedor').append('<h3>Este es un parrafo agregado con Jquery</h3>');
            

        });
        
        </Script>

        <script>
           
        </script>
        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>

    </body>
</html>
